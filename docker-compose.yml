services:
  db:
    image: mysql:8.0
    container_name: perojewelry_db
    environment:
      MYSQL_DATABASE: perojewelry
      MYSQL_USER: perojewelry_user
      MYSQL_PASSWORD: secretpassword
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - perojewelry_network
    command: --default-authentication-plugin=mysql_native_password

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: perojewelry_server
    ports:
      - "8000:8000"
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=perojewelry
      - DB_USERNAME=perojewelry_user
      - DB_PASSWORD=secretpassword
    volumes:
      - ./server:/var/www/html
    depends_on:
      - db
    networks:
      - perojewelry_network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: perojewelry_client
    ports:
      - "4200:4200"
    volumes:
      - ./client:/app
      - /app/node_modules
    networks:
      - perojewelry_network

volumes:
  db_data:

networks:
  perojewelry_network:
    driver: bridge

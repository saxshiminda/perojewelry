services:
  # Optional local MySQL: docker compose --profile local-db up
  db:
    profiles: ["local-db"]
    image: mysql:8.0
    container_name: perojewelry_db
    environment:
      MYSQL_DATABASE: perojewelry
      MYSQL_USER: perojewelry_user
      MYSQL_PASSWORD: secretpassword
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - perojewelry_network
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpassword", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: perojewelry_server
    ports:
      - "8000:8000"
    env_file:
      - ./server/.env
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      # TiDB TLS CA path inside the container (repo is mounted at /var/www/html)
      DB_SSL: "true"
      MYSQL_ATTR_SSL_CA: /var/www/html/certs/isrgrootx1.pem
      SANCTUM_STATEFUL_DOMAINS: localhost:4200,127.0.0.1:4200,localhost:8000,127.0.0.1:8000
    volumes:
      - ./server:/var/www/html
    networks:
      - perojewelry_network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: perojewelry_client
    ports:
      - "4200:4200"
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    depends_on:
      - server
    networks:
      - perojewelry_network

volumes:
  db_data:
  client_node_modules:

networks:
  perojewelry_network:
    driver: bridge

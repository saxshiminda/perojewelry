services:
  db:
    image: mysql:8.0
    container_name: perojewelry_db
    environment:
      MYSQL_DATABASE: perojewelry
      MYSQL_USER: perojewelry_user
      MYSQL_PASSWORD: secretpassword
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - perojewelry_network
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpassword", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: perojewelry_server
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: perojewelry
      DB_USERNAME: perojewelry_user
      DB_PASSWORD: secretpassword
      SANCTUM_STATEFUL_DOMAINS: localhost:4200,127.0.0.1:4200,localhost:8000,127.0.0.1:8000
    volumes:
      - ./server:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - perojewelry_network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: perojewelry_client
    ports:
      - "4200:4200"
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    depends_on:
      - server
    networks:
      - perojewelry_network

volumes:
  db_data:
  client_node_modules:

networks:
  perojewelry_network:
    driver: bridge

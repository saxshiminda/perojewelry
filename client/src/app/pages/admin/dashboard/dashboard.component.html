<div class="admin-container">
  <h1 class="mb-2">Dashboard</h1>

  <div class="stats-grid mb-3">
    <div class="stat-card">
      <div class="stat-icon bg-accent">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="8" r="2.5"/>
          <path d="M12 10.5v3"/>
          <path d="M8 17c1.5-2 2.5-3 4-3s2.5 1 4 3"/>
          <path d="M7 20h10"/>
        </svg>
      </div>
      <div class="stat-info">
        <h3>Total Pieces</h3>
        <p class="stat-value">{{ stats.totalProducts }}</p>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon bg-muted">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 6h15l-1.5 9h-12z"/>
          <path d="M6 6l-2-3H2"/>
          <circle cx="9" cy="20" r="1.25"/>
          <circle cx="18" cy="20" r="1.25"/>
        </svg>
      </div>
      <div class="stat-info">
        <h3>Orders</h3>
        <p class="stat-value">{{ stats.totalOrders }}</p>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon bg-soft">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="9" cy="8" r="3"/>
          <circle cx="16" cy="9" r="2.5"/>
          <path d="M3 19c0-2.5 2.5-4.5 6-4.5s6 2 6 4.5"/>
          <path d="M14 14.5c2.2.3 4 1.8 4 4.5"/>
        </svg>
      </div>
      <div class="stat-info">
        <h3>Customers</h3>
        <p class="stat-value">{{ stats.totalUsers }}</p>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon bg-success">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="8"/>
          <path d="M12 7v10"/>
          <path d="M9.5 9.5c.5-1 1.5-1.5 2.5-1.5 1.5 0 2.5.8 2.5 2s-1 2-2.5 2h-1c-1.5 0-2.5.8-2.5 2s1 2 2.5 2c1 0 2-.5 2.5-1.5"/>
        </svg>
      </div>
      <div class="stat-info">
        <h3>Revenue</h3>
        <p class="stat-value">${{ stats.revenue | number:'1.2-2' }}</p>
      </div>
    </div>
  </div>

  <div class="admin-card">
    <h2 class="mb-2">Quick Actions</h2>
    <div class="flex gap-2">
      <a routerLink="/admin/products" class="action-btn">
        <span class="btn-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="1"/>
            <path d="M3 9h18"/>
            <path d="M9 9v11"/>
          </svg>
        </span>
        Manage Products
      </a>
      <a routerLink="/admin/products/new" class="action-btn">
        <span class="btn-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="8"/>
            <path d="M12 8v8"/>
            <path d="M8 12h8"/>
          </svg>
        </span>
        Add New Piece
      </a>
      <a routerLink="/admin/categories" class="action-btn">
        <span class="btn-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 7h16"/>
            <path d="M4 12h16"/>
            <path d="M4 17h10"/>
          </svg>
        </span>
        Manage Categories
      </a>
      <button class="action-btn disabled" type="button">
        <span class="btn-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 4h9l3 3v13H6z"/>
            <path d="M9 12h6"/>
            <path d="M9 16h6"/>
            <path d="M9 8h3"/>
          </svg>
        </span>
        View Reports (Coming Soon)
      </button>
    </div>
  </div>
</div>

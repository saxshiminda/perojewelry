<div class="admin-container">
  <div class="admin-breadcrumb mb-1">
    <a routerLink="/admin/dashboard">Dashboard</a>
    <span class="breadcrumb-sep">›</span>
    <span class="text-gray">Customers</span>
  </div>
  <h1 class="mb-2">Customers</h1>

  <div class="admin-card mb-2">
    <div class="flex gap-2 flex-wrap items-center">
      <input type="text" [(ngModel)]="searchQuery" (keyup.enter)="onSearch()" placeholder="Search name or email" class="form-control flex-1" style="min-width: 220px;">
      <button class="btn btn-cyan" (click)="onSearch()">Search</button>
    </div>
  </div>

  <div class="admin-card">
    <div *ngIf="loading" class="text-center py-3">Loading customers...</div>

    <table *ngIf="!loading" class="admin-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Orders</th>
          <th>Joined</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let customer of customers">
          <td class="font-bold">{{ customer.name }}</td>
          <td>{{ customer.email }}</td>
          <td>{{ customer.orders_count }}</td>
          <td>{{ customer.created_at | date:'mediumDate' }}</td>
        </tr>
        <tr *ngIf="customers.length === 0">
          <td colspan="4" class="text-center py-3">No customers found.</td>
        </tr>
      </tbody>
    </table>

    <div class="flex justify-between items-center mt-3" *ngIf="!loading && totalItems > 0">
      <span class="text-gray text-sm">Showing page {{ currentPage }} of {{ lastPage }} ({{ totalItems }} total)</span>
      <div class="flex gap-1">
        <button class="btn btn-outline" [disabled]="currentPage === 1" (click)="prevPage()">Previous</button>
        <button class="btn btn-outline" [disabled]="currentPage === lastPage" (click)="nextPage()">Next</button>
      </div>
    </div>
  </div>
</div>

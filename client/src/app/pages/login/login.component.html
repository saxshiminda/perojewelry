<div class="auth-page py-4">
  <div class="container flex justify-center">
    <div class="auth-card shadow-lg">
      <h2 class="text-center mb-1">Welcome Back</h2>
      <p class="text-center text-gray mb-3">Login to your account to continue</p>
      
      <form (ngSubmit)="onSubmit()" class="flex-col gap-2">
        <div *ngIf="errorMessage" class="text-white text-center p-2 mb-2 radius-sm" style="background-color: var(--soft-red)">
          {{ errorMessage }}
        </div>
        <div class="form-group pb-1">
          <label class="font-bold mb-1">Email Address</label>
          <input type="email" name="email" [(ngModel)]="email" class="form-control" placeholder="hello@example.com" required>
        </div>
        <div class="form-group pb-1">
          <label class="font-bold mb-1">Password</label>
          <input type="password" name="password" [(ngModel)]="password" class="form-control" placeholder="••••••••" required>
        </div>
        
        <div class="flex justify-between items-center text-sm text-gray mt-1 pb-1">
          <label class="flex items-center gap-1 cursor-pointer">
            <input type="checkbox"> Remember me
          </label>
          <a href="#" class="hover-cyan text-cyan">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-cyan w-100 mt-2 text-white">Login</button>
      </form>
      
      <p class="text-center mt-3 text-sm">
        Don't have an account? <a routerLink="/register" class="text-cyan font-bold">Register here</a>
      </p>
    </div>
  </div>
</div>

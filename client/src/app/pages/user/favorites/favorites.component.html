<div class="container py-3">
  <div class="header-section mb-3">
    <h1>❤️ My Favorites</h1>
    <p class="text-gray">Pieces you've loved and saved for later.</p>
  </div>

  <ng-container *ngIf="favorites$ | async as favorites">
    <div class="favorites-grid" *ngIf="favorites.length > 0; else emptyState" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px;">
      <app-product-card *ngFor="let product of favorites" [product]="product"></app-product-card>
    </div>
  </ng-container>

  <ng-template #emptyState>
    <div class="empty-card text-center py-5">
      <div class="empty-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/>
        </svg>
      </div>
      <h2>Your favorites list is empty</h2>
      <p class="mb-2">Browse the shop and save pieces you love.</p>
      <a routerLink="/shop" class="btn btn-cyan text-white py-2 px-3 radius-md font-bold">Explore Shop</a>
    </div>
  </ng-template>
</div>

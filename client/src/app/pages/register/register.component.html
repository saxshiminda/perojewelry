<div class="auth-page py-4">
  <div class="container flex justify-center">
    <div class="auth-card shadow-lg">
      <h2 class="text-center mb-1">Create Account</h2>
      <p class="text-center text-gray mb-3">Join our community today</p>
      
      <form (ngSubmit)="onSubmit()" class="flex-col gap-2">
        <div *ngIf="errorMessage" class="text-white text-center p-2 mb-2 radius-sm" style="background-color: var(--soft-red)">
          {{ errorMessage }}
        </div>
        <div class="form-group pb-1">
          <label for="name" class="font-bold mb-1">Full Name</label>
          <input type="text" id="name" name="name" [(ngModel)]="name" placeholder="Enter your full name" class="form-control" required>
        </div>
        <div class="form-group pb-1">
          <label for="email" class="font-bold mb-1">Email</label>
          <input type="email" id="email" name="email" [(ngModel)]="email" placeholder="Enter your email" class="form-control" required>
        </div>
        <div class="form-group pb-1">
          <label for="password" class="font-bold mb-1">Password</label>
          <input type="password" id="password" name="password" [(ngModel)]="password" placeholder="Create a password" class="form-control" required>
        </div>
        <div class="form-group pb-1">
          <label for="confirm-password" class="font-bold mb-1">Confirm Password</label>
          <input type="password" id="confirm-password" name="password_confirmation" [(ngModel)]="password_confirmation" placeholder="Confirm your password" class="form-control" required>
        </div>
        
        <button type="submit" class="btn btn-yellow w-100 mt-2 text-dark">Register</button>
      </form>
      
      <p class="text-center mt-3 text-sm">
        Already have an account? <a routerLink="/login" class="text-cyan font-bold">Login here</a>
      </p>
    </div>
  </div>
</div>

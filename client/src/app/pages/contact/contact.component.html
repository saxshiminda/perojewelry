<div class="page-header py-4 bg-light mb-4 text-center">
  <div class="container">
    <div class="breadcrumb text-sm mb-2 font-bold justify-center flex">
      <a routerLink="/" class="text-dark hover-cyan">Home</a><span style="margin: 0 8px;">/</span><span class="text-cyan">Contact</span>
    </div>
    <h1 class="title-display" style="font-size: 2.5rem;">Contact Us</h1>
  </div>
</div>

<div class="container mb-5">
  <div class="contact-grid flex gap-4">
    <div class="contact-info flex-1">
      <h2 class="title-display mb-2">Get in touch</h2>
      <p class="text-gray mb-4">Questions about a piece, custom work, or shipping — send a note and we'll get back to you.</p>
      
      <div class="info-item flex items-center gap-2 mb-3">
        <div class="icon-circle bg-light-cyan">📍</div>
        <div>
          <h4 class="mb-0">Address</h4>
          <p class="text-gray text-sm">Handmade studio — worldwide shipping</p>
        </div>
      </div>
      
      <div class="info-item flex items-center gap-2 mb-3">
        <div class="icon-circle bg-light-yellow">📞</div>
        <div>
          <h4 class="mb-0">Phone</h4>
          <p class="text-gray text-sm">@perojewelry</p>
        </div>
      </div>
      
      <div class="info-item flex items-center gap-2 mb-3">
        <div class="icon-circle bg-light-green">✉️</div>
        <div>
          <h4 class="mb-0">Email</h4>
          <p class="text-gray text-sm">hello@perojewelry.com</p>
        </div>
      </div>
    </div>
    
    <div class="contact-form flex-1 border-card p-4">
      <h3 class="title-display mb-3">Send us a message</h3>
      <div class="form-group mb-2">
        <label class="text-sm font-bold block mb-1">Your Name</label>
        <input type="text" class="form-control" placeholder="John Doe">
      </div>
      <div class="form-group mb-2">
        <label class="text-sm font-bold block mb-1">Your Email</label>
        <input type="email" class="form-control" placeholder="john@example.com">
      </div>
      <div class="form-group mb-3">
        <label class="text-sm font-bold block mb-1">Message</label>
        <textarea class="form-control" rows="5" placeholder="How can we help you?"></textarea>
      </div>
      <button class="btn btn-cyan w-full text-center py-2" style="font-size: 1.125rem;">Send Message</button>
    </div>
  </div>
</div>
